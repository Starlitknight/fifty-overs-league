name: world-tick
# The umpire, hosted free: every hour this settles all 19 national leagues
# on the World Service schema inside the game's existing Supabase project.
# Design guarantees that make cron throttling harmless (BLUEPRINT law 4):
# runDue heals every missed day, done ticks are no-ops, and each match
# insert is idempotent - a late, doubled or killed run cannot corrupt the
# world. The engine is the committed shipped build (index.html) run
# headless via test/engine-vm.mjs; a full planet-day is ~95 matches (~15s).
on:
  schedule:
    # off-peak minute: GitHub delays/drops popular quarter-hour marks
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      reset_world:
        description: "Type YES-RESET to drop the world schema and refound from scratch (owner-only, destructive)"
        required: false
        default: 'no'

concurrency:
  group: world-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WORLD_SCHEMA: world
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install service deps (pg)
        working-directory: server
        run: npm install --omit=dev --no-audit --no-fund
      # Two ways in, easiest first:
      #   SUPABASE_DB_PASSWORD — just the database password; the connection
      #     string is constructed here (project ref + region are public) and
      #     the session-pooler host is probed automatically.
      #   DATABASE_URL — a full connection string, used verbatim if present.
      - name: Resolve database connection
        working-directory: server
        env:
          RAW_URL: ${{ secrets.DATABASE_URL || secrets.SUPABASE_DB_URL || secrets.POSTGRES_URL }}
          DB_PASS: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: egaipdksvztqqgouriyc
          REGION: us-east-1
        run: |
          if [ -z "$RAW_URL" ] && [ -z "$DB_PASS" ]; then
            echo "::error::No database secret found. Easiest fix: add a secret named SUPABASE_DB_PASSWORD containing just the database password (Supabase → Project Settings → Database → Reset database password). Alternatively add DATABASE_URL with the full session-pooler connection string."
            exit 1
          fi
          node - <<'EOF'
          const pg = require('pg');
          const enc = encodeURIComponent;
          const cands = [];
          if (process.env.RAW_URL) cands.push(process.env.RAW_URL);
          if (process.env.DB_PASS) {
            // mobile copy-paste loves to smuggle in whitespace; trim it away
            const ref = process.env.PROJECT_REF, reg = process.env.REGION, p = enc(process.env.DB_PASS.trim());
            // session pooler only (5432): transaction pooling would break the
            // per-connection search_path the service relies on
            for (const n of [0, 1, 2]) {
              cands.push(`postgresql://postgres.${ref}:${p}@aws-${n}-${reg}.pooler.supabase.com:5432/postgres`);
            }
          }
          (async () => {
            for (const url of cands) {
              const pool = new pg.Pool({ connectionString: url, max: 1, ssl: { rejectUnauthorized: false }, connectionTimeoutMillis: 8000 });
              try {
                const r = await pool.query('SELECT 1 AS ok');
                if (r.rows[0].ok === 1) {
                  const fs = require('fs');
                  fs.appendFileSync(process.env.GITHUB_ENV, 'DATABASE_URL=' + url + '\n');
                  console.log('::add-mask::' + url);
                  console.log('connected via', url.replace(/:[^@:]*@/, ':***@'));
                  await pool.end();
                  process.exit(0);
                }
              } catch (e) {
                console.log('candidate failed:', url.replace(/:[^@:]*@/, ':***@'), '-', String(e.message).slice(0, 80));
              }
              await pool.end().catch(() => {});
            }
            console.log('::error::Could not connect with any candidate. If you added SUPABASE_DB_PASSWORD, make sure it is the DATABASE password (Project Settings → Database → Reset database password), not an API key.');
            process.exit(1);
          })();
          EOF
      - name: Reset the world (only on explicit YES-RESET dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_world == 'YES-RESET' }}
        working-directory: server
        run: |
          node -e "
          import('pg').then(async ({ default: pg }) => {
            const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL, max: 1, ssl: { rejectUnauthorized: false } });
            await pool.query('DROP SCHEMA IF EXISTS world CASCADE');
            console.log('world schema dropped - the next steps refound from scratch');
            await pool.end();
          }).catch(e => { console.error(e); process.exit(1); });"
      - name: Migrate
        working-directory: server
        run: node migrate.mjs
      - name: Found or expand the world (idempotent)
        working-directory: server
        run: node init-world.mjs
      - name: Settle everything due, every nation
        working-directory: server
        run: node tick.mjs
