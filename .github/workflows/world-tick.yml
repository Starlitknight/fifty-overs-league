name: world-tick
# The umpire, hosted free: every hour this settles all 19 national leagues
# on the World Service schema inside the game's existing Supabase project.
# Design guarantees that make cron throttling harmless (BLUEPRINT law 4):
# runDue heals every missed day, done ticks are no-ops, and each match
# insert is idempotent - a late, doubled or killed run cannot corrupt the
# world. The engine is the committed shipped build (index.html) run
# headless via test/engine-vm.mjs; a full planet-day is ~95 matches (~15s).
on:
  schedule:
    # off-peak minutes: GitHub delays/drops popular quarter-hour marks, and in
    # practice skips whole hourly firings too - observed gaps of 3-4 hours,
    # which left England's 17:00 UTC settle unbanked into the evening. Two
    # staggered lines double the chances each hour; every run is idempotent,
    # so the extra firings cost nothing when there is nothing due.
    - cron: '23 * * * *'
    - cron: '51 * * * *'
    # windows open on the hour, and the prebank (the round simulated at the
    # first ball, FTP-style) should land minutes after - a third line close
    # to the top of the hour keeps the feed viewer's opening overs on time
    - cron: '4 * * * *'
  workflow_dispatch:
    inputs:
      reset_world:
        description: "Type YES-RESET to drop the world schema and refound from scratch (owner-only, destructive)"
        required: false
        default: 'no'

concurrency:
  group: world-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    # FIFTEEN MINUTES WAS A TRAP, and it sprang on 6 August. GitHub held a
    # scheduled firing for one hour and forty-three minutes - the comment
    # above already warned it does this - and by the time the run started
    # there were hours of world to heal. runDue heals every missed day, so a
    # late run has MORE to do than an on-time one, and this one needed longer
    # than fifteen minutes. It was killed at the cap. The next firing found
    # the same backlog, needed the same time, and was killed at the same cap.
    # Every run for six hours died at exactly 15:0x having settled nothing:
    # the catch-up could never fit inside the window the catch-up was given.
    #
    # An hour, then. A steady-state settle is one to three minutes, so this
    # ceiling is never touched on a normal day; it exists so that the one
    # abnormal day can dig the world out instead of timing out forever. The
    # tick is idempotent and the concurrency group serialises it, so a long
    # run costs nothing but the minutes it uses.
    timeout-minutes: 60
    env:
      WORLD_SCHEMA: world
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install service deps (pg)
        working-directory: server
        run: npm install --omit=dev --no-audit --no-fund
      # Two ways in, easiest first:
      #   SUPABASE_DB_PASSWORD — just the database password; the connection
      #     string is constructed here (project ref + region are public) and
      #     the session-pooler host is probed automatically.
      #   DATABASE_URL — a full connection string, used verbatim if present.
      - name: Resolve database connection
        working-directory: server
        env:
          RAW_URL: ${{ secrets.DATABASE_URL || secrets.SUPABASE_DB_URL || secrets.POSTGRES_URL }}
          DB_PASS: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: egaipdksvztqqgouriyc
          REGION: us-east-1
        run: |
          if [ -z "$RAW_URL" ] && [ -z "$DB_PASS" ]; then
            echo "::error::No database secret found. Easiest fix: add a secret named SUPABASE_DB_PASSWORD containing just the database password (Supabase → Project Settings → Database → Reset database password). Alternatively add DATABASE_URL with the full session-pooler connection string."
            exit 1
          fi
          node - <<'EOF'
          const pg = require('pg');
          const enc = encodeURIComponent;
          const cands = [];
          if (process.env.RAW_URL) cands.push(process.env.RAW_URL);
          if (process.env.DB_PASS) {
            // mobile copy-paste loves to smuggle in whitespace; trim it away
            const ref = process.env.PROJECT_REF, reg = process.env.REGION, p = enc(process.env.DB_PASS.trim());
            // session pooler only (5432): transaction pooling would break the
            // per-connection search_path the service relies on
            for (const n of [0, 1, 2]) {
              cands.push(`postgresql://postgres.${ref}:${p}@aws-${n}-${reg}.pooler.supabase.com:5432/postgres`);
            }
          }
          (async () => {
            for (const url of cands) {
              const pool = new pg.Pool({ connectionString: url, max: 1, ssl: { rejectUnauthorized: false }, connectionTimeoutMillis: 8000 });
              try {
                const r = await pool.query('SELECT 1 AS ok');
                if (r.rows[0].ok === 1) {
                  const fs = require('fs');
                  fs.appendFileSync(process.env.GITHUB_ENV, 'DATABASE_URL=' + url + '\n');
                  console.log('::add-mask::' + url);
                  console.log('connected via', url.replace(/:[^@:]*@/, ':***@'));
                  await pool.end();
                  process.exit(0);
                }
              } catch (e) {
                console.log('candidate failed:', url.replace(/:[^@:]*@/, ':***@'), '-', String(e.message).slice(0, 80));
              }
              await pool.end().catch(() => {});
            }
            console.log('::error::Could not connect with any candidate. If you added SUPABASE_DB_PASSWORD, make sure it is the DATABASE password (Project Settings → Database → Reset database password), not an API key.');
            process.exit(1);
          })();
          EOF
      - name: Reset the world (only on explicit YES-RESET dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_world == 'YES-RESET' }}
        working-directory: server
        run: |
          node -e "
          import('pg').then(async ({ default: pg }) => {
            const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL, max: 1, ssl: { rejectUnauthorized: false } });
            await pool.query('DROP SCHEMA IF EXISTS world CASCADE');
            console.log('world schema dropped - the next steps refound from scratch');
            await pool.end();
          }).catch(e => { console.error(e); process.exit(1); });"
      - name: Migrate
        working-directory: server
        run: node migrate.mjs
      - name: Found or expand the world (idempotent)
        working-directory: server
        run: node init-world.mjs
      # A cricketer is not his name (089): every man made from here on is
      # stamped with an id at birth, and this hands the same ids to the men
      # who were already on the books. Idempotent, and a club where everybody
      # has one is skipped without touching the generator, so once the world
      # is stamped this step is one cheap read per club.
      - name: Stamp any cricketer still without an id
        working-directory: server
        run: node backfill-pids.mjs --write
      # The hands a man plays with (091/092): 084 put the world's hands on a
      # real scale and a refold took it straight back off, because the nets
      # replay from a baseline no migration had ever written. This reads every
      # generated man's hands off the clean squad his own seed makes, matched
      # by id - exact, idempotent, and impossible to apply twice. A world
      # already in step costs one derive per club and writes nothing.
      - name: Put any hands still on the old scale back on the bell
        working-directory: server
        run: node resync-hands.mjs --write
      # A club's name is its own. Ten pairs of clubs in this world share a name
      # with a club in their own league - two Galway CCs, two Chicago CCs - all
      # of them a Division Two side wearing the name of the Division One club
      # from its town. The generator stopped dealing that a while ago; nothing
      # renames a club after it is founded, so only a repair can reach it. It
      # never touches a club somebody manages, and a world already clean reads
      # the clubs table once and writes nothing.
      - name: Give any club sharing a name its own back
        working-directory: server
        run: node rename-twins.mjs --write
      # A club dealt before migration 092 has no best_xi_strength, and the
      # ranking then works it out from the squad one club at a time. This
      # settles them for good. Idempotent - the value is a pure function of the
      # squad - and once every row is filled it reads nothing and writes
      # nothing, so it costs a single indexed count per tick forever after.
      - name: Give any club without one the worth of its eleven
        working-directory: server
        run: node backfill-strength.mjs --write
      # AND EVERY MAN A CARD FOR WHAT HE HAS DONE (094). Two jobs, both cheap
      # and both idempotent: lift any history still embedded in a squad blob
      # onto its own row, and open an empty card for a cricketer who has none -
      # so a page never has to tell "he has played nothing" from "there is no
      # row for him". Once a country has settled there is nothing left to lift
      # and nothing left to open, and this is two statements that change no
      # rows. It can never overwrite a real card with an empty one: the lift
      # only touches men who still carry something on the hot row, and the open
      # does nothing on conflict.
      - name: Give any cricketer without one a card for what he has done
        working-directory: server
        run: node backfill-history.mjs --write
      - name: Settle everything due, every nation
        working-directory: server
        run: node tick.mjs
      # AND THE MORNING PAPER, after every nation has settled - which is why it
      # is a step here and not a hook inside the tick: the settle takes the
      # countries one at a time, and the paper reports all of them. Idempotent,
      # so the two ticks an hour that are not a new day write nothing.
      - name: Print the morning paper
        working-directory: server
        run: node print-gazette.mjs
