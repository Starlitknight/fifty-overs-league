name: engine-calibration
# The engine freeze gate (BLUEPRINT law 1): fails if the shipped engine's
# behaviour drifts from engine/calibration-golden.json.
on:
  push:
    paths: ['engine/**', 'build.sh', 'tools/calibration*.mjs', 'test/engine-vm.mjs']
  pull_request:
    paths: ['engine/**', 'build.sh', 'tools/calibration*.mjs', 'test/engine-vm.mjs']
  workflow_dispatch:
jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: ./build.sh
      - run: node tools/calibration-check.mjs
